# ETF metadata overrides — supplements HistoricalDataEngine's instrument
# master with fields NSE/Kite don't provide (asset_class, index_tracked,
# issuer, expense_ratio, AUM). See docs/PHASE3_ETF_Universe_Optimizer.md
# for the full rationale.
#
# HONEST LIMITATION: expense_ratio, tracking_error_pct, and aum_crores are
# left null throughout this file. expense_ratio and aum_crores come from
# AMFI/fund-house factsheets, which this sandbox has no network access to
# fetch, and AUM specifically changes daily — a number seeded once here
# would be stale within days regardless. tracking_error_pct requires a
# benchmark index price series, which Phase 2's Data Engine does not fetch
# (it fetches ETF prices, not the underlying index level) — wiring that up
# is a documented follow-up, not done here. Before using
# ETFUniverseOptimizer's scoring for a real decision, populate whichever of
# these fields you can from a real feed. Until then, the scoring engine
# treats missing values as "unknown, excluded from that metric" rather than
# silently as zero — see scoring.py.
#
# asset_class and index_tracked ARE populated where confidently known —
# these are stable facts (an ETF's tracked index doesn't change day to day)
# and don't need a live feed to be correct as of this writing.

