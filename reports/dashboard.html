<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ETF Platform Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f5f5f5;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
}

canvas {
    max-height: 400px;
}
</style>
</head>

<body>

<div class="card">
<h1>ETF Platform Dashboard</h1>

<table>
<tr><th>Metric</th><th>Value</th></tr>
<tr><td>CAGR</td><td>18.5%</td></tr>
<tr><td>XIRR</td><td>17.8%</td></tr>
<tr><td>Max Drawdown</td><td>12.4%</td></tr>
<tr><td>Volatility</td><td>15.6%</td></tr>
<tr><td>Sharpe Ratio</td><td>1.42</td></tr>
<tr><td>Sortino Ratio</td><td>2.08</td></tr>
<tr><td>Calmar Ratio</td><td>1.49</td></tr>
</table>

</div>


<div class="card">
<h2>AI Decision Summary</h2>
<table>
<tr><td>Health Score</td><td>92</td></tr>
<tr><td>Risk Level</td><td>LOW</td></tr>
<tr><td>Market</td><td>BULL</td></tr>
<tr><td>Strategy</td><td>AGGRESSIVE BUY</td></tr>
</table>
</div>


<div class="card">
<h2>Equity Curve</h2>
<canvas id="equityChart"></canvas>
</div>

<script>
const equityData = [100000, 105000, 110000];

new Chart(
document.getElementById("equityChart"),
{
type:"line",
data:{
labels:equityData.map((_,i)=>i+1),
datasets:[{
label:"Portfolio Value",
data:equityData
}]
}
});
</script>

</body>
</html>
